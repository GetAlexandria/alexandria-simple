name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      shared: ${{ steps.filter.outputs.shared }}
      versions: ${{ steps.filter.outputs.versions }}
      shell: ${{ steps.filter.outputs.shell }}
      workspace: ${{ steps.filter.outputs.workspace }}
      markdown: ${{ steps.filter.outputs.markdown }}
      plugin: ${{ steps.filter.outputs.plugin }}
      ax: ${{ steps.filter.outputs.ax }}
      viewer: ${{ steps.filter.outputs.viewer }}
      plugin_runtime: ${{ steps.filter.outputs.plugin_runtime }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect changed areas
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            shared:
              - ".github/workflows/validate-plugin.yml"
              - ".prettierignore"
              - ".prettierrc"
              - ".tool-versions"
              - "eslint.config.js"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "tsconfig.json"
            versions:
              - "VERSION"
              - "package.json"
              - "packages/ax/package.json"
              - "packages/viewer/package.json"
              - "packages/alexandria-plugin/package.json"
              - "packages/alexandria-plugin/.claude-plugin/plugin.json"
            shell:
              - "install.sh"
              - "setup"
              - "scripts/**"
            workspace:
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "packages/*/package.json"
            markdown:
              - "**/*.md"
              - "!repos/**"
              - ".markdownlint-cli2.jsonc"
            plugin:
              - "packages/alexandria-plugin/**"
            ax:
              - "packages/ax/**"
              - "install.sh"
              - "setup"
              - "VERSION"
              - "packages/alexandria-plugin/**"
              - "packages/viewer/**"
              # check-ax runs real-bundle regression tests (the #628/#633
              # pins load docs/alexandria/library directly), so a
              # library-only change must re-run it — #699 (Learning plane
              # L1) broke those pins invisibly because card-only diffs
              # skipped this job. Same silent-skip class as #627/#649.
              - "docs/alexandria/library/**"
            viewer:
              - "packages/viewer/**"
            plugin_runtime:
              - "packages/plugin-runtime/**"
              - "README.public.md"
              - "install.sh"
              - "VERSION"
              - "CHANGELOG.md"
              - "LICENSE"
              - "packages/alexandria-plugin/**"

  validate-alexandria-plugin:
    needs: changes
    if: needs.changes.outputs.plugin == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Setup pnpm
        run: corepack enable pnpm

      - name: Validate Alexandria plugin package
        run: pnpm --filter @alexandria/plugin run validate

  validate-plugin:
    needs:
      - changes
      - validate-alexandria-plugin
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check plugin validation results
        env:
          NEEDS_CONTEXT: ${{ toJson(needs) }}
        run: |
          node <<'NODE'
          const needs = JSON.parse(process.env.NEEDS_CONTEXT);
          const failed = Object.entries(needs).filter(([, job]) =>
            ["failure", "cancelled"].includes(job.result),
          );
          if (failed.length > 0) {
            console.error(
              `Required plugin validation jobs failed: ${failed
                .map(([name]) => name)
                .join(", ")}`,
            );
            process.exit(1);
          }
          console.log("Required plugin validation jobs passed or were skipped.");
          NODE

  check-versions:
    needs: changes
    if: needs.changes.outputs.versions == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check version consistency
        run: |
          set -euo pipefail
          PKG_VERSION=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('package.json','utf8')).version)")
          FILE_VERSION=$(cat VERSION)
          AX_VERSION=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('packages/ax/package.json','utf8')).version)")
          VIEWER_VERSION=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('packages/viewer/package.json','utf8')).version)")
          PLUGIN_PKG_VERSION=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('packages/alexandria-plugin/package.json','utf8')).version)")
          PLUGIN_VERSION=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('packages/alexandria-plugin/.claude-plugin/plugin.json','utf8')).version)")
          if [ "$PKG_VERSION" != "$FILE_VERSION" ] || [ "$PKG_VERSION" != "$AX_VERSION" ] || [ "$PKG_VERSION" != "$VIEWER_VERSION" ] || [ "$PKG_VERSION" != "$PLUGIN_PKG_VERSION" ] || [ "$PKG_VERSION" != "$PLUGIN_VERSION" ]; then
            echo "Version mismatch: root=$PKG_VERSION VERSION=$FILE_VERSION ax=$AX_VERSION viewer=$VIEWER_VERSION plugin-package=$PLUGIN_PKG_VERSION plugin-json=$PLUGIN_VERSION"
            exit 1
          fi
          echo "Versions consistent: $PKG_VERSION"

  check-shell:
    needs: changes
    if: needs.changes.outputs.shell == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install shell tooling
        run: ./scripts/ensure-shell-tools --install

      - name: ShellCheck shell scripts
        run: |
          shellcheck -x \
            install.sh \
            setup \
            scripts/ensure-shell-tools \
            scripts/setup-dev

      - name: Check shell formatting
        run: |
          shfmt -d \
            install.sh \
            setup \
            scripts/ensure-shell-tools \
            scripts/setup-dev

  check-workspace-install:
    needs: changes
    if: needs.changes.outputs.workspace == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup pnpm
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

  check-markdown:
    needs: changes
    if: needs.changes.outputs.markdown == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Markdown checks
        run: pnpm exec markdownlint-cli2 "**/*.md" "#node_modules" "#**/node_modules" "#repos" "#**/repos" "#.repos" "#**/.repos" "#dist" "#.tmp" "#.var" "#.claude"

  check-ax:
    needs: changes
    if: needs.changes.outputs.ax == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup pnpm
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint ax
        run: pnpm --filter @alexandria/ax run lint

      - name: Check ax formatting
        run: pnpm --filter @alexandria/ax run format:check

      - name: Typecheck ax
        run: pnpm --filter @alexandria/ax run typecheck

      - name: Test ax
        run: pnpm --filter @alexandria/ax run test

  check-viewer:
    needs: changes
    if: needs.changes.outputs.viewer == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup pnpm
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check viewer
        run: pnpm --filter @alexandria/viewer run check

      - name: Check viewer formatting
        run: pnpm --filter @alexandria/viewer run format:check

      - name: Test viewer
        run: pnpm --filter @alexandria/viewer run test

      - name: Build viewer
        run: pnpm --filter @alexandria/viewer run build

      - name: Build viewer Storybook
        run: pnpm --filter @alexandria/viewer run storybook:build

  test-viewer-e2e:
    needs: changes
    if: needs.changes.outputs.viewer == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup pnpm
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: packages/viewer

      # The Playwright config's webServer builds the viewer itself and serves
      # it via tests/serve-viewer-fixture.ts, a self-contained fixture server
      # — the whole suite runs hermetically against that fixture, with no
      # live Alexandria runtime, so it runs unmodified here.
      - name: Run viewer e2e
        run: pnpm --filter @alexandria/viewer run test:e2e

      # test-results/ (traces, screenshots) is only populated on failure — no
      # explicit html reporter is configured, so there is no playwright-report/
      # to upload in the passing case.
      - name: Upload Playwright test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: viewer-playwright-report
          path: packages/viewer/test-results/
          retention-days: 14

  test-plugin-runtime:
    needs: changes
    if: needs.changes.outputs.plugin_runtime == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup pnpm
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test plugin runtime
        run: bun test packages/plugin-runtime

  check-and-test:
    needs:
      - changes
      - check-versions
      - check-shell
      - check-workspace-install
      - check-markdown
      - check-ax
      - check-viewer
      - test-viewer-e2e
      - test-plugin-runtime
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check package CI results
        env:
          NEEDS_CONTEXT: ${{ toJson(needs) }}
        run: |
          node <<'NODE'
          const needs = JSON.parse(process.env.NEEDS_CONTEXT);
          const failed = Object.entries(needs).filter(([, job]) =>
            ["failure", "cancelled"].includes(job.result),
          );
          if (failed.length > 0) {
            console.error(
              `Required package CI jobs failed: ${failed
                .map(([name]) => name)
                .join(", ")}`,
            );
            process.exit(1);
          }
          console.log("Required package CI jobs passed or were skipped.");
          NODE

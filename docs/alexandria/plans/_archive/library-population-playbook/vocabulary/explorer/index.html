<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lexicon Explorer</title>
<link rel="stylesheet" href="explorer.css">
</head>
<body>

<header class="app-header">
  <div class="title">
    <strong>Lexicon Explorer</strong>
    <span class="subtitle">8 worked Lexicons · the workbench</span>
  </div>
  <nav class="view-tabs" id="view-tabs">
    <button data-view="picker" class="active">📚 Lexicon</button>
    <button data-view="compare">⚖ Compare</button>
    <button data-view="category">🔍 By category</button>
    <button data-view="closest">🎯 Closest fit</button>
  </nav>
  <div class="legend">
    <span class="legend-item"><span class="dot uv-true"></span>user-visible</span>
    <span class="legend-item"><span class="dot uv-false"></span>engine-internal</span>
    <span class="legend-item"><span class="facet-mark">⬗</span>facet card</span>
  </div>
</header>

<main id="main"></main>

<footer class="app-footer">
  <span id="meta-line"></span>
  <span class="hint">Re-build the data: <code>bun build-vocabularies-json.ts</code></span>
</footer>

<script src="explorer.js"></script>
</body>
</html>

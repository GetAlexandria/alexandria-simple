<!--
  Learning-plane elicitation walk — self-contained tool, no build step.

  Serve locally (do not open via file://, so relative behavior matches the
  viewer's own tools and fonts load consistently):

      cd docs/alexandria/plans/learning-plane
      python3 -m http.server 8914

  Then open http://localhost:8914/learning-plane-walk.html

  This is a walk-and-capture tool, not a product surface: it presents the
  ruled Learning-plane model chunk by chunk and shows, as visibly blank
  slots, the card-contract fields each answer will eventually fill. It does
  not persist anything — the director's answers get written back into
  design-log.md / the hand-authored cards by hand, same as the strategy
  build's taxonomy walk. One file, no external assets besides the Google
  Fonts link below.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Alexandria · Learning-Plane Walk</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
<style>
  :root {
    --page-bg: #faf6ee;
    --panel-bg: #fffdf8;
    --ink: #1f1d18;
    --ink-soft: #2b2924;
    --muted: #5c6470;
    --muted-warm: #6b665b;
    --hairline: #e7e1d4;
    --hairline-soft: #d9d4c5;
    --gold: #b8863a;
    --gold-bright: #d4a052;

    --serif: "Cormorant Garamond", Georgia, serif;
    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;

    /* type register palette: Research (held) / Experiment (bounded) / Measure (flowing) */
    --type-research: #0e7490;
    --type-experiment: #be123c;
    --type-measure: #047857;
    --type-arc: #b8863a;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--page-bg);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }

  body {
    min-height: 100vh;
    padding-bottom: 6rem;
  }

  ::selection { background: #f0dfc0; }

  /* ---------- top bar ---------- */

  .topbar {
    position: sticky;
    top: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1.5rem;
    padding: 0.9rem 2rem;
    background: rgba(250, 246, 238, 0.92);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--hairline);
  }

  .topbar-title {
    font-family: var(--serif);
    font-size: 1.35rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    color: var(--ink-soft);
  }

  .topbar-title .dot {
    color: var(--gold);
    margin: 0 0.15em;
    font-weight: 400;
  }

  .topbar-right {
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .progress-pill {
    font-family: var(--mono);
    font-size: 0.78rem;
    color: var(--muted);
    letter-spacing: 0.02em;
    min-width: 3.6rem;
    text-align: right;
  }

  /* ---------- walk stage ---------- */

  #walk-mode {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 3.2rem 1.5rem 2rem;
  }

  .walk-stage {
    width: 100%;
    max-width: 780px;
  }

  .dot-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.55rem;
    margin-bottom: 1.1rem;
    flex-wrap: wrap;
  }

  .dot-nav button {
    width: 11px;
    height: 11px;
    padding: 0;
    border-radius: 50%;
    border: 1.5px solid var(--gold);
    background: transparent;
    cursor: pointer;
    transition: transform 0.15s ease, width 0.15s ease, height 0.15s ease;
  }

  .dot-nav button:hover { transform: scale(1.25); }

  .dot-nav button.current {
    width: 15px;
    height: 15px;
    background: var(--gold);
  }

  .bottom-nav-bar {
    display: flex;
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 60;
    align-items: center;
    justify-content: center;
    gap: 1.4rem;
    padding: 0.85rem 1.5rem;
    background: rgba(250, 246, 238, 0.94);
    backdrop-filter: blur(6px);
    border-top: 1px solid var(--hairline);
    box-shadow: 0 -8px 24px -16px rgba(31,29,24,0.18);
  }

  .bottom-nav-center {
    font-family: var(--sans);
    font-size: 0.86rem;
    font-weight: 600;
    color: var(--ink-soft);
    text-align: center;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .bottom-nav-center .bottom-nav-count {
    font-family: var(--mono);
    font-weight: 400;
    color: var(--muted);
    margin-left: 0.5em;
  }

  .nav-btn {
    font-family: var(--sans);
    font-size: 0.88rem;
    font-weight: 600;
    padding: 0.6rem 1.3rem;
    border-radius: 12px;
    border: 1px solid var(--hairline-soft);
    background: var(--panel-bg);
    color: var(--ink-soft);
    cursor: pointer;
    transition: all 0.15s ease;
    flex-shrink: 0;
  }

  .nav-btn:hover:not(:disabled) {
    border-color: var(--gold);
    color: var(--gold);
    box-shadow: 0 2px 10px -4px rgba(184,134,58,0.35);
  }

  .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  /* ---------- chunk card ---------- */

  .chunk-card {
    background: var(--panel-bg);
    border: 1px solid var(--hairline);
    border-radius: 20px;
    padding: 3rem 3.2rem 2.6rem;
    box-shadow: 0 1px 2px rgba(31, 29, 24, 0.03), 0 12px 32px -18px rgba(31, 29, 24, 0.18);
    animation: fadeUp 0.32s ease;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .section-label {
    font-family: var(--sans);
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 0.6rem;
  }

  .chunk-name {
    font-family: var(--serif);
    font-size: 2.4rem;
    font-weight: 600;
    line-height: 1.08;
    letter-spacing: 0.005em;
    margin-bottom: 0.7rem;
    color: var(--ink-soft);
  }

  .chunk-def {
    font-family: var(--serif);
    font-size: 1.22rem;
    font-style: italic;
    color: var(--muted-warm);
    line-height: 1.5;
    margin: 0 0 1.9rem;
    max-width: 66ch;
  }

  .sub-label {
    font-family: var(--sans);
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 2rem 0 0.6rem;
    padding-top: 1.3rem;
    border-top: 1px solid var(--hairline);
  }

  .sub-label:first-of-type { border-top: none; padding-top: 0; margin-top: 0.4rem; }

  /* recap block (chunk 1: display-only ruled model) */

  .recap-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 0.9rem;
    margin-bottom: 1.6rem;
  }

  .recap-type {
    border-radius: 14px;
    border: 1.5px solid;
    padding: 1.1rem 1.2rem 1.2rem;
  }

  .recap-type-name {
    font-family: var(--serif);
    font-size: 1.3rem;
    font-weight: 600;
    margin-bottom: 0.2rem;
  }

  .recap-type-reg {
    font-family: var(--sans);
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    opacity: 0.75;
    margin-bottom: 0.5rem;
  }

  .recap-type-def {
    font-family: var(--sans);
    font-size: 0.85rem;
    color: var(--muted-warm);
    line-height: 1.5;
  }

  .recap-line {
    font-family: var(--serif);
    font-size: 1.05rem;
    line-height: 1.6;
    color: var(--ink-soft);
    margin: 0 0 0.9rem;
  }

  .recap-line b { color: var(--gold); font-weight: 600; }

  .grade-ladder {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 0.5rem;
    font-family: var(--mono);
    font-size: 0.9rem;
    margin: 0.6rem 0 0.3rem;
  }

  .grade-step {
    padding: 0.3rem 0.75rem;
    border-radius: 8px;
    background: var(--page-bg);
    border: 1px solid var(--hairline-soft);
    color: var(--ink-soft);
  }

  .grade-arrow { color: var(--muted); }

  /* prompt block — the elicitation question itself */

  .prompt-block {
    border-left: 3px solid var(--gold);
    background: rgba(184,134,58,0.06);
    border-radius: 0 12px 12px 0;
    padding: 1.1rem 1.3rem;
    margin: 0 0 1.7rem;
  }

  .prompt-label {
    font-family: var(--sans);
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 0.45rem;
  }

  .prompt-text {
    font-family: var(--serif);
    font-size: 1.15rem;
    font-style: italic;
    color: var(--ink-soft);
    line-height: 1.5;
  }

  .seed-note {
    font-family: var(--sans);
    font-size: 0.82rem;
    color: var(--muted);
    line-height: 1.55;
    margin: 0.6rem 0 0;
  }

  .seed-note b { color: var(--muted-warm); }

  /* field-slots — the visible blank card-contract fields */

  .field-slots {
    border: 1px dashed var(--hairline-soft);
    border-radius: 14px;
    padding: 1.1rem 1.3rem 1.3rem;
    margin-bottom: 1.6rem;
    background: repeating-linear-gradient(
      135deg,
      rgba(217, 212, 197, 0.12),
      rgba(217, 212, 197, 0.12) 8px,
      transparent 8px,
      transparent 16px
    );
  }

  .field-slots-title {
    font-family: var(--sans);
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--muted-warm);
    margin-bottom: 0.7rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .field-slots-title .card-type-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    display: inline-block;
  }

  .field-row {
    display: flex;
    align-items: baseline;
    gap: 0.6rem;
    padding: 0.32rem 0;
    border-bottom: 1px dotted var(--hairline-soft);
    flex-wrap: wrap;
  }

  .field-row:last-child { border-bottom: none; }

  .field-key {
    font-family: var(--mono);
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--ink-soft);
    min-width: 9.5rem;
    flex-shrink: 0;
  }

  .field-blank {
    font-family: var(--serif);
    font-style: italic;
    font-size: 0.92rem;
    color: var(--muted);
    flex: 1;
    min-width: 12rem;
    border-bottom: 1px solid var(--hairline-soft);
    padding-bottom: 0.1rem;
  }

  /* section chip list (per-corpus lessons / per-bet risks etc) */

  .item-card {
    border: 1px solid var(--hairline);
    border-radius: 14px;
    padding: 1rem 1.2rem 1.1rem;
    margin-bottom: 1rem;
    background: var(--page-bg);
  }

  .item-card-title {
    font-family: var(--serif);
    font-size: 1.2rem;
    font-weight: 600;
    color: var(--ink-soft);
    margin-bottom: 0.35rem;
  }

  .item-card-meta {
    font-family: var(--sans);
    font-size: 0.78rem;
    color: var(--muted-warm);
    margin-bottom: 0.6rem;
  }

  .item-card-body {
    font-family: var(--sans);
    font-size: 0.88rem;
    color: var(--ink-soft);
    line-height: 1.55;
  }

  .tag-row {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    margin-top: 0.5rem;
  }

  .tag-chip {
    font-family: var(--sans);
    font-size: 0.72rem;
    font-weight: 600;
    padding: 0.25rem 0.6rem;
    border-radius: 999px;
    border: 1px solid var(--hairline-soft);
    color: var(--muted-warm);
    background: var(--panel-bg);
  }

  .na-note {
    font-family: var(--serif);
    font-style: italic;
    font-size: 0.85rem;
    color: var(--muted);
    margin-top: 0.4rem;
  }

  .stop-list {
    list-style: none;
    margin: 0.3rem 0 0;
    padding: 0;
  }

  .stop-list li {
    font-family: var(--sans);
    font-size: 0.84rem;
    color: var(--ink-soft);
    padding: 0.2rem 0;
  }

  .stop-list b {
    font-family: var(--mono);
    font-size: 0.72rem;
    text-transform: uppercase;
    color: var(--gold);
    margin-right: 0.5em;
  }

  .harvest-question {
    font-family: var(--serif);
    font-size: 1.55rem;
    font-style: italic;
    color: var(--ink-soft);
    line-height: 1.4;
    text-align: center;
    margin: 1.6rem 0 2rem;
    padding: 1.6rem 1.2rem;
    border-top: 1px solid var(--hairline);
    border-bottom: 1px solid var(--hairline);
  }

  .arc-card {
    border: 1.5px solid var(--type-arc);
    border-radius: 14px;
    padding: 1.1rem 1.3rem 1.2rem;
    margin-bottom: 1.1rem;
    background: rgba(184,134,58,0.045);
  }

  .arc-card-name {
    font-family: var(--serif);
    font-size: 1.35rem;
    font-weight: 600;
    color: var(--ink-soft);
  }

  .arc-card-intent {
    font-family: var(--serif);
    font-style: italic;
    font-size: 1rem;
    color: var(--muted-warm);
    margin: 0.3rem 0 0.7rem;
  }

  .arc-card-prove {
    font-family: var(--sans);
    font-size: 0.85rem;
    color: var(--ink-soft);
    line-height: 1.55;
  }

  .arc-card-prove b {
    font-family: var(--sans);
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--gold);
    display: block;
    margin-bottom: 0.25rem;
  }

  /* nav hint */

  .walk-nav-hint {
    font-family: var(--serif);
    font-style: italic;
    font-size: 0.9rem;
    color: var(--muted);
    text-align: center;
    margin-top: 1.2rem;
  }

  @media (max-width: 640px) {
    .chunk-card { padding: 2.1rem 1.4rem 1.9rem; }
    .chunk-name { font-size: 1.9rem; }
    .topbar { padding: 0.8rem 1.1rem; flex-wrap: wrap; }
    .field-key { min-width: 100%; }
  }
</style>
</head>
<body>

  <div class="topbar">
    <div class="topbar-title">Alexandria<span class="dot">·</span>Learning-Plane Walk</div>
    <div class="topbar-right">
      <span class="progress-pill" id="progress-pill">1 / 6</span>
    </div>
  </div>

  <div id="walk-mode">
    <div class="walk-stage">
      <div class="dot-nav" id="dot-nav"></div>
      <div id="chunk-container"></div>
    </div>
  </div>

  <div class="bottom-nav-bar" id="bottom-nav-bar">
    <button class="nav-btn" id="prev-btn" onclick="prevChunk()">‹ Prev</button>
    <div class="bottom-nav-center" id="bottom-nav-center"></div>
    <button class="nav-btn" id="next-btn" onclick="nextChunk()">Next ›</button>
  </div>

<script>
/* ===================== helpers ===================== */

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str == null ? "" : String(str);
  return div.innerHTML;
}

function fieldRow(key, hint) {
  return `<div class="field-row"><span class="field-key">${escapeHtml(key)}</span><span class="field-blank">${escapeHtml(hint || "— blank —")}</span></div>`;
}

function fieldSlots(cardType, colorVar, fields) {
  return `
    <div class="field-slots">
      <div class="field-slots-title"><span class="card-type-dot" style="background:${colorVar};"></span>${escapeHtml(cardType)} card fields this answer fills</div>
      ${fields.map(f => fieldRow(f[0], f[1])).join("")}
    </div>
  `;
}

/* ===================== CHUNK DATA ===================== */
/* Content sourced from docs/alexandria/plans/learning-plane/design-log.md
   (D1-D10 + Marvel-wiki releases + evidence lifecycle) and card-contract.md.
   This tool is display + elicitation-prompt only — it writes nothing back;
   answers get hand-transcribed into the design log and the cards. */

const CHUNKS = [

  /* ---------------- CHUNK 1 — the ruled model recap ---------------- */
  {
    id: "recap",
    label: "Phase 0 — Ratify",
    name: "The Ruled Model",
    def: "Before the walk starts: the shape already ruled, for the director to confirm or correct in one pass.",
    render() {
      return `
        <div class="sub-label">Three types — held / bounded / flowing</div>
        <div class="recap-grid">
          <div class="recap-type" style="border-color:${'#0e7490'};">
            <div class="recap-type-name" style="color:#0e7490;">Research</div>
            <div class="recap-type-reg" style="color:#0e7490;">evidence HELD</div>
            <div class="recap-type-def">Settled learning — a distilled lesson, a called experiment's result, an open observation. No lifecycle. Informs Bets (↑) and product cards (across).</div>
          </div>
          <div class="recap-type" style="border-color:${'#be123c'};">
            <div class="recap-type-name" style="color:#be123c;">Experiment</div>
            <div class="recap-type-reg" style="color:#be123c;">evidence SOUGHT, bounded</div>
            <div class="recap-type-def">Ends by design — the only lifecycle-bearing type: planned → running → called, with a pre-committed stop rule. Tests a Bet.</div>
          </div>
          <div class="recap-type" style="border-color:${'#047857'};">
            <div class="recap-type-name" style="color:#047857;">Measure</div>
            <div class="recap-type-reg" style="color:#047857;">evidence FLOWING</div>
            <div class="recap-type-def">Never ends — a defined quantity, a target, a trend. No verdict. Watches a Bet; a significant reading becomes Research.</div>
          </div>
        </div>

        <div class="sub-label">Three shelves — the activities that power the loop</div>
        <p class="recap-line"><b>research</b> (Research lives here) · <b>experiments</b> (Experiment) · <b>measurement</b> (Measure) — plus the <b>_index</b> keystone narrating the loop itself: learning drives strategy, strategy drives product, product generates learning.</p>

        <div class="sub-label">Biography-WHEN</div>
        <p class="recap-line">Every learning card carries <b>WHEN as a biography</b> — one narration, three tenses: what happened (the layers), what stands now, what's intended next. The <b>explicit-N/A rule</b>: an empty tense is written ("N/A — planned, no past yet"), never left silent.</p>

        <div class="sub-label">The boundary rule</div>
        <p class="recap-line" style="font-size:1.15rem; font-style:italic;">"Does it end by design?" — Pre-committed stop → <b>Experiment</b>. Persists indefinitely, reading → <b>Measure</b>. One bounded look with no metric → <b>probe-kind Experiment</b> with a time/reps stop.</p>

        <div class="sub-label">The evidence lifecycle — five jobs</div>
        <p class="recap-line">Consult (before authoring a Bet/Experiment/arc) · Capture (verdict, threshold reading, or incidental at arc-close) · Propagate (Research banks → proposes Bet confidence/risk edits) · Refine (unreconciled evidence accumulates → curation pass) · Watch (sweep diffs / grade-scaled re-looks). For this first build, Jobs 1-2 run as steps inside this very walk.</p>

        <div class="prompt-block">
          <div class="prompt-label">Ratify the grade words</div>
          <div class="prompt-text">The evidence-rigor ladder is a working label set — confirm the words or re-word them now, before they get echoed onto every Experiment and Research card this session produces.</div>
          <div class="grade-ladder">
            <span class="grade-step">say</span><span class="grade-arrow">&lt;</span>
            <span class="grade-step">demo</span><span class="grade-arrow">&lt;</span>
            <span class="grade-step">pilot</span><span class="grade-arrow">&lt;</span>
            <span class="grade-step">market</span>
          </div>
          <p class="seed-note">Say = a claim, unverified by behavior. Demo = shown once, small N. Pilot = run with real users/stakes, bounded scale. Market = live at scale, the strongest tier.</p>
        </div>
        ${fieldSlots("all learning cards", "var(--gold)", [
          ["grade (ladder words)", "confirmed as say / demo / pilot / market, or re-worded"],
        ])}
      `;
    }
  },

  /* ---------------- CHUNK 2 — the arc ladder ---------------- */
  {
    id: "arcs",
    label: "Phase 4 → moved first",
    name: "The Arc Ladder",
    def: "Named first, on purpose — the release ladder is the skeleton everything else hangs on. Marvel-wiki framing: the library holds intent and canon, never execution.",
    render() {
      return `
        <p class="recap-line">A release lives in the library as a thin <b>arc page</b>: what it exists to prove (featured intent), what it's riding along on (cameo / should-meet), and its biography (planned → in-flight → shipped-into-canon). GitHub remains the bullpen — the library never manages the work, only the intent behind it and the canon after.</p>

        <div class="prompt-block">
          <div class="prompt-label">Name the releases / arcs</div>
          <div class="prompt-text">What are the next arcs, in order? "First proof" is already in the air for Bet #2 (colleagues) — what else belongs on the ladder, and what does each one exist to prove?</div>
        </div>

        <div class="arc-card">
          <div class="arc-card-name">Arc — [ name pending ]</div>
          <div class="arc-card-intent">"This arc exists to …" — the featured-intent declaration</div>
          <div class="arc-card-prove"><b>Must prove</b>— blank — (the must-meet experiments/measures that gate this arc; should-meet items ride along as cameo)</div>
        </div>
        <p class="seed-note">Repeat this card per named arc during the session. Each arc's members are set on the member cards themselves (<code>milestone</code> + <code>gate: must-meet|should-meet</code>) — the arc page never lists tasks.</p>

        ${fieldSlots("Arc (Concept, context: _index)", "var(--type-arc)", [
          ["prefLabel", "— blank —"],
          ["milestone (own key)", "— blank —"],

/* ===================== render ===================== */

let currentChunk = 0;

function renderDots() {
  const nav = document.getElementById("dot-nav");
  nav.innerHTML = CHUNKS.map((c, i) =>
    `<button class="${i === currentChunk ? "current" : ""}" title="${escapeHtml(c.name)}" onclick="goToChunk(${i})"></button>`
  ).join("");
}

function renderChunk(idx) {
  currentChunk = idx;
  const chunk = CHUNKS[idx];
  const container = document.getElementById("chunk-container");
  container.innerHTML = `
    <div class="chunk-card">
      <div class="section-label">${escapeHtml(chunk.label)}</div>
      <div class="chunk-name">${escapeHtml(chunk.name)}</div>
      <div class="chunk-def">${escapeHtml(chunk.def)}</div>
      ${chunk.render()}
    </div>
  `;
  document.getElementById("progress-pill").textContent = `${idx + 1} / ${CHUNKS.length}`;
  document.getElementById("prev-btn").disabled = idx === 0;
  document.getElementById("next-btn").disabled = idx === CHUNKS.length - 1;
  document.getElementById("bottom-nav-center").innerHTML =
    `${escapeHtml(chunk.name)}<span class="bottom-nav-count">${idx + 1}/${CHUNKS.length}</span>`;
  renderDots();
  window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
}

function goToChunk(idx) {
  renderChunk(idx);
}

function nextChunk() {
  if (currentChunk < CHUNKS.length - 1) renderChunk(currentChunk + 1);
}

function prevChunk() {
  if (currentChunk > 0) renderChunk(currentChunk - 1);
}

document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") nextChunk();
  if (e.key === "ArrowLeft") prevChunk();
});

renderChunk(0);
</script>

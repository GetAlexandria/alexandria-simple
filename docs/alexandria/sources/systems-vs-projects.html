<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects vs Systems — LifeBuild</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body, #root {
            height: 100%;
            width: 100%;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
const { useState, useEffect } = React;

const Presentation = () => {
  const [currentSlide, setCurrentSlide] = useState(0);

  const slides = [
    // Slide 0: Title
    () => (
      <div className="slide title-slide">
        <div className="title-content">
          <div className="badge">LIFEBUILD</div>
          <h1>Projects vs Systems</h1>
          <p className="subtitle">Understanding the two types of work on your Life Map</p>
          <div className="start-hint" onClick={() => setCurrentSlide(1)} style={{ cursor: 'pointer' }}>
            <span>Click here or press → to begin</span>
          </div>
        </div>
        <div className="decorative-shapes">
          <div className="shape shape-1"></div>
          <div className="shape shape-2"></div>
        </div>
      </div>
    ),

    // Slide 1: What is a Project?
    () => (
      <div className="slide">
        <div className="section-label">PART 1: PROJECTS</div>
        <h2>What is a Project?</h2>
        <div className="project-visual">
          <div className="timeline">
            <div className="timeline-start">
              <div className="dot start-dot"></div>
              <span>START</span>
            </div>
            <div className="timeline-line">
              <div className="arrow"></div>
            </div>
            <div className="timeline-end">
              <div className="dot end-dot"></div>
              <span>DONE</span>
            </div>
          </div>
          <p className="example-text">"Fix the garage door"</p>
        </div>
        <div className="key-insight">
          <div className="insight-icon">💡</div>
          <p>A project is <strong>bounded work</strong> with a <strong>finish line</strong>.</p>
        </div>
      </div>
    ),

    // Slide 2: Projects Have Progress
    () => (
      <div className="slide">
        <div className="section-label">PART 1: PROJECTS</div>
        <h2>Projects Have Progress</h2>
        <div className="progress-examples">
          <div className="progress-row">
            <div className="progress-bar">
              <div className="progress-fill" style={{width: '0%'}}></div>
            </div>
            <span className="progress-label">0% — Just started</span>
          </div>
          <div className="progress-row">
            <div className="progress-bar">
              <div className="progress-fill" style={{width: '40%'}}></div>
            </div>
            <span className="progress-label">40% — Making headway</span>
          </div>
          <div className="progress-row">
            <div className="progress-bar">
              <div className="progress-fill" style={{width: '80%'}}></div>
            </div>
            <span className="progress-label">80% — Almost there</span>
          </div>
          <div className="progress-row complete">
            <div className="progress-bar">
              <div className="progress-fill" style={{width: '100%'}}></div>
            </div>
            <span className="progress-label">100% — DONE → Archives</span>
          </div>
        </div>
        <div className="key-insight">
          <div className="insight-icon">❓</div>
          <p>The question is always: <strong>"How close am I to finished?"</strong></p>
        </div>
      </div>
    ),

    // Slide 3: Project Board
    () => (
      <div className="slide">
        <div className="section-label">PART 1: PROJECTS</div>
        <h2>Project Anatomy</h2>
        <div className="project-board">
          <div className="board-header">
            <span className="board-title">Fix Garage Door</span>
            <span className="board-purpose bronze">Bronze</span>
            <div className="mini-progress">
              <div className="mini-progress-fill" style={{width: '80%'}}></div>
            </div>
            <span className="percent">80%</span>
          </div>
          <div className="kanban">
            <div className="kanban-column">
              <div className="column-header">TO DO</div>
              <div className="task-card">Buy parts</div>
            </div>
            <div className="kanban-column">
              <div className="column-header">IN PROGRESS</div>
              <div className="task-card active">Install spring</div>
            </div>
            <div className="kanban-column">
              <div className="column-header">DONE</div>
              <div className="task-card done">Research problem</div>
              <div className="task-card done">Order parts</div>
            </div>
          </div>
          <div className="flow-arrow">
            <span>Work moves left → right</span>
          </div>
        </div>
      </div>
    ),

    // Slide 4: Transition to Systems
    () => (
      <div className="slide transition-slide">
        <div className="transition-content">
          <h2>But what about work that never ends?</h2>
          <div className="examples-grid">
            <div className="example-item">🚗 Car maintenance</div>
            <div className="example-item">💑 Weekly date night</div>
            <div className="example-item">💊 Taking medications</div>
            <div className="example-item">💰 Paying bills</div>
          </div>
          <p className="transition-question">These don't have a finish line...</p>
        </div>
      </div>
    ),

    // Slide 5: What is a System?
    () => (
      <div className="slide">
        <div className="section-label system-label">PART 2: SYSTEMS</div>
        <h2>What is a System?</h2>
        <div className="system-visual">
          <div className="cycle-diagram">
            <div className="cycle-center">
              <div className="system-icon">⚙️</div>
              <span>SYSTEM</span>
            </div>
            <div className="cycle-ring">
              <div className="cycle-arrow arrow-1">↓</div>
              <div className="cycle-node node-1">outputs</div>
              <div className="cycle-arrow arrow-2">↓</div>
              <div className="cycle-node node-2">done</div>
              <div className="cycle-arrow arrow-3">↺</div>
            </div>
          </div>
          <div className="cycle-label">♻️ CONTINUOUS</div>
        </div>
        <div className="key-insight system-insight">
          <div className="insight-icon">💡</div>
          <p>A system is <strong>persistent infrastructure</strong> that <strong>generates work</strong>.</p>
        </div>
      </div>
    ),

    // Slide 6: Health vs Progress
    () => (
      <div className="slide">
        <div className="section-label system-label">PART 2: SYSTEMS</div>
        <h2>Health, Not Progress</h2>
        <div className="comparison-boxes">
          <div className="comparison-box project-box">
            <div className="box-label">Projects ask:</div>
            <div className="box-question">"Am I done?"</div>
            <div className="box-metric">
              <div className="progress-bar small">
                <div className="progress-fill" style={{width: '80%'}}></div>
              </div>
              <span>80%</span>
            </div>
          </div>
          <div className="vs-divider">vs</div>
          <div className="comparison-box system-box">
            <div className="box-label">Systems ask:</div>
            <div className="box-question">"Is it running smoothly?"</div>
            <div className="box-metric">
              <div className="health-dots">
                <span className="dot filled"></span>
                <span className="dot filled"></span>
                <span className="dot filled"></span>
                <span className="dot filled"></span>
                <span className="dot"></span>
              </div>
              <span>Good</span>
            </div>
          </div>
        </div>
        <div className="key-insight system-insight">
          <p>You don't "complete" your car maintenance system. You keep it <strong>healthy</strong>.</p>
        </div>
      </div>
    ),

    // Slide 7: Core Difference
    () => (
      <div className="slide">
        <div className="section-label system-label">PART 2: SYSTEMS</div>
        <h2>The Core Difference</h2>
        <div className="difference-table">
          <div className="table-row header-row">
            <div className="cell"></div>
            <div className="cell project-header">PROJECT</div>
            <div className="cell system-header">SYSTEM</div>
          </div>
          <div className="table-row">
            <div className="cell label">Example</div>
            <div className="cell">"Fix garage door"</div>
            <div className="cell">"Car maintenance"</div>
          </div>
          <div className="table-row">
            <div className="cell label">Shape</div>
            <div className="cell"><span className="shape-arrow">────────►</span></div>
            <div className="cell"><span className="shape-loop">♻️</span></div>
          </div>
          <div className="table-row">
            <div className="cell label">Work</div>
            <div className="cell">Contains it</div>
            <div className="cell">Generates it</div>
          </div>
          <div className="table-row">
            <div className="cell label">Success</div>
            <div className="cell">Done</div>
            <div className="cell">Running smoothly</div>
          </div>
          <div className="table-row">
            <div className="cell label">Ends?</div>
            <div className="cell">Yes → Archives</div>
            <div className="cell">No (until uprooted)</div>
          </div>
        </div>
      </div>
    ),

    // Slide 8: System Components
    () => (
      <div className="slide">
        <div className="section-label system-label">PART 2: SYSTEMS</div>
        <h2>System Anatomy</h2>
        <div className="system-anatomy">
          <div className="anatomy-row top-row">
            <div className="component purpose-component">
              <div className="component-label">PURPOSE</div>
              <div className="component-desc">What does this maintain?</div>
            </div>
          </div>
          <div className="anatomy-row middle-row">
            <div className="component">
              <div className="component-label">INPUTS</div>
              <div className="component-desc">What feeds it</div>
            </div>
            <div className="component">
              <div className="component-label">PATTERN</div>
              <div className="component-desc">When work happens</div>
            </div>
            <div className="component">
              <div className="component-label">CONTROLS</div>
              <div className="component-desc">Health metrics</div>
            </div>
          </div>
          <div className="anatomy-row bottom-row">
            <div className="component">
              <div className="component-label">OUTPUTS</div>
              <div className="component-desc">Tasks, events, alerts</div>
            </div>
            <div className="component">
              <div className="component-label">DELEGATION</div>
              <div className="component-desc">Who does what</div>
            </div>
          </div>
        </div>
      </div>
    ),

    // Slide 9: Car Maintenance Example
    () => (
      <div className="slide">
        <div className="section-label system-label">PART 2: SYSTEMS</div>
        <h2>Example: Car Maintenance</h2>
        <div className="example-breakdown">
          <div className="example-row">
            <div className="example-label">PURPOSE</div>
            <div className="example-value">"Keep my car running reliably"</div>
          </div>
          <div className="example-row">
            <div className="example-label">PATTERN</div>
            <div className="example-value">
              <div className="pattern-items">
                <span>Every 5k mi → Oil change</span>
                <span>Every 10k mi → Tire rotation</span>
                <span>Annual → Full inspection</span>
                <span>When low → Reorder fluids</span>
              </div>
            </div>
          </div>
          <div className="example-row">
            <div className="example-label">CONTROLS</div>
            <div className="example-value">On-time %, streak, next due date</div>
          </div>
          <div className="example-row">
            <div className="example-label">OUTPUTS</div>
            <div className="example-value">Tasks → Bronze stack, calendar events, alerts</div>
          </div>
        </div>
      </div>
    ),

    // Slide 10: Life Map View
    () => (
      <div className="slide">
        <div className="section-label">PART 3: IN LIFEBUILD</div>
        <h2>On the Life Map</h2>
        <div className="life-map-preview">
          <div className="map-section">
            <div className="category-card">
              <div className="category-header health-category">HEALTH</div>
              <div className="card-items">
                <div className="map-item project-item">
                  <span className="item-icon">📋</span>
                  <span className="item-name">Get CPAP Setup</span>
                  <div className="item-metric progress">
                    <div className="tiny-progress">
                      <div className="tiny-fill" style={{width: '40%'}}></div>
                    </div>
                  </div>
                </div>
                <div className="map-item system-item">
                  <span className="item-icon">⚙️</span>
                  <span className="item-name">Fitness Routine</span>
                  <div className="item-metric health">
                    <span className="health-indicator good">●●●●○</span>
                  </div>
                </div>
              </div>
            </div>
            <div className="category-card">
              <div className="category-header finance-category">FINANCES</div>
              <div className="card-items">
                <div className="map-item project-item">
                  <span className="item-icon">📋</span>
                  <span className="item-name">Refinance House</span>
                  <div className="item-metric progress">
                    <div className="tiny-progress">
                      <div className="tiny-fill" style={{width: '60%'}}></div>
                    </div>
                  </div>
                </div>
                <div className="map-item system-item">
                  <span className="item-icon">⚙️</span>
                  <span className="item-name">Bill Pay</span>
                  <div className="item-metric health">
                    <span className="health-indicator great">●●●●●</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div className="legend">
            <div className="legend-item">
              <span className="legend-icon">📋</span>
              <span>Projects show <strong>progress</strong></span>
            </div>
            <div className="legend-item">
              <span className="legend-icon">⚙️</span>
              <span>Systems show <strong>health</strong></span>
            </div>
          </div>
        </div>
      </div>
    ),

    // Slide 11: System Board
    () => (
      <div className="slide">
        <div className="section-label">PART 3: IN LIFEBUILD</div>
        <h2>System Board</h2>
        <div className="system-board">
          <div className="board-header system-board-header">
            <div className="header-left">
              <span className="board-icon">⚙️</span>
              <span className="board-title">Car Maintenance</span>
            </div>
            <div className="header-right">
              <span className="health-indicator good">●●●●○</span>
              <span className="health-label">Good</span>
            </div>
          </div>
          <div className="board-content">
            <div className="board-section">
              <div className="section-title">PATTERN</div>
              <div className="pattern-list">
                <div className="pattern-item">5k mi → Oil change</div>
                <div className="pattern-item">10k mi → Tire rotation</div>
                <div className="pattern-item">Annual → Inspection</div>
              </div>
            </div>
            <div className="board-section">
              <div className="section-title">THIS WEEK</div>
              <div className="task-list">
                <div className="system-task">☐ Check tire pressure (Sat)</div>
              </div>
            </div>
            <div className="board-section">
              <div className="section-title">HISTORY</div>
              <div className="history-row">
                <span className="history-dots">✓ ✓ ✓ ✓ ✗ ✓ ✓ ✓</span>
                <span className="history-note">(1 missed)</span>
              </div>
            </div>
          </div>
          <div className="board-actions">
            <button className="action-btn hibernate">Hibernate</button>
            <button className="action-btn upgrade">Upgrade</button>
            <button className="action-btn uproot">Uproot</button>
          </div>
        </div>
      </div>
    ),

    // Slide 12: Three Actions
    () => (
      <div className="slide">
        <div className="section-label">PART 3: IN LIFEBUILD</div>
        <h2>System Actions</h2>
        <div className="actions-grid">
          <div className="action-card">
            <div className="action-icon">💤</div>
            <div className="action-name">HIBERNATE</div>
            <div className="action-desc">Pause temporarily. Config saved.</div>
            <div className="action-example">"Traveling for a month—pause hot tub maintenance"</div>
            <div className="action-flow">⚙️ → 💤 → ⚙️</div>
          </div>
          <div className="action-card">
            <div className="action-icon">⬆️</div>
            <div className="action-name">UPGRADE</div>
            <div className="action-desc">Improve it. Spawns Silver project.</div>
            <div className="action-example">"Oil changes too frequent—optimize the system"</div>
            <div className="action-flow">⚙️ → 📋 → ⚙️+</div>
          </div>
          <div className="action-card">
            <div className="action-icon">🌱</div>
            <div className="action-name">UPROOT</div>
            <div className="action-desc">End deliberately. History archived.</div>
            <div className="action-example">"Sold the car—don't need this anymore"</div>
            <div className="action-flow">⚙️ → 📁</div>
          </div>
        </div>
        <div className="key-insight">
          <p>Notice: there's no <strong>"Complete"</strong> button. Systems don't complete.</p>
        </div>
      </div>
    ),

    // Slide 13: How Systems Get Created
    () => (
      <div className="slide">
        <div className="section-label">PART 3: IN LIFEBUILD</div>
        <h2>How Systems Get Created</h2>
        <div className="creation-flow">
          <div className="flow-step">
            <div className="step-number">1</div>
            <div className="step-content">
              <div className="step-title">Notice the need</div>
              <div className="step-desc">"I keep forgetting oil changes"</div>
            </div>
          </div>
          <div className="flow-connector">↓</div>
          <div className="flow-step silver-step">
            <div className="step-number">2</div>
            <div className="step-content">
              <div className="step-title">Build the system</div>
              <div className="step-desc">Silver project: "Set up car maintenance system"</div>
            </div>
          </div>
          <div className="flow-connector">↓</div>
          <div className="flow-step">
            <div className="step-number">3</div>
            <div className="step-content">
              <div className="step-title">Plant the system</div>
              <div className="step-desc">Silver project completes → System goes live</div>
            </div>
          </div>
          <div className="flow-connector">↓</div>
          <div className="flow-step">
            <div className="step-number">4</div>
            <div className="step-content">
              <div className="step-title">System runs</div>
              <div className="step-desc">Generates tasks forever ♻️</div>
            </div>
          </div>
        </div>
      </div>
    ),

    // Slide 14: Summary
    () => (
      <div className="slide summary-slide">
        <h2>Summary</h2>
        <div className="summary-comparison">
          <div className="summary-column project-column">
            <div className="column-title">PROJECTS</div>
            <div className="summary-items">
              <div className="summary-row">
                <span className="summary-label">Shape</span>
                <span className="summary-value">────────►</span>
              </div>
              <div className="summary-row">
                <span className="summary-label">Metric</span>
                <span className="summary-value">Progress %</span>
              </div>
              <div className="summary-row">
                <span className="summary-label">Question</span>
                <span className="summary-value">"Am I done?"</span>
              </div>
              <div className="summary-row">
                <span className="summary-label">Ends?</span>
                <span className="summary-value">Yes → Archives</span>
              </div>
              <div className="summary-row">
                <span className="summary-label">Examples</span>
                <span className="summary-value examples">Fix door, Plan trip, Learn Spanish 101</span>
              </div>
            </div>
          </div>
          <div className="summary-column system-column">
            <div className="column-title">SYSTEMS</div>
            <div className="summary-items">
              <div className="summary-row">
                <span className="summary-label">Shape</span>
                <span className="summary-value">♻️</span>
              </div>
              <div className="summary-row">
                <span className="summary-label">Metric</span>
                <span className="summary-value">Health ●●●●○</span>
              </div>
              <div className="summary-row">
                <span className="summary-label">Question</span>
                <span className="summary-value">"Is it healthy?"</span>
              </div>
              <div className="summary-row">
                <span className="summary-label">Ends?</span>
                <span className="summary-value">No (until uprooted)</span>
              </div>
              <div className="summary-row">
                <span className="summary-label">Examples</span>
                <span className="summary-value examples">Car care, Date night, Bill pay</span>
              </div>
            </div>
          </div>
        </div>
        <div className="summary-footer">
          <p><strong>Silver projects</strong> often create systems.</p>
          <p><strong>Systems</strong> generate bronze tasks.</p>
          <p>Both serve your <strong>Charter</strong>.</p>
        </div>
      </div>
    ),
  ];

  const nextSlide = () => {
    if (currentSlide < slides.length - 1) {
      setCurrentSlide(currentSlide + 1);
    }
  };

  const prevSlide = () => {
    if (currentSlide > 0) {
      setCurrentSlide(currentSlide - 1);
    }
  };

  useEffect(() => {
    const handleKeyDown = (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') {
        setCurrentSlide(prev => Math.min(prev + 1, slides.length - 1));
      } else if (e.key === 'ArrowLeft') {
        setCurrentSlide(prev => Math.max(prev - 1, 0));
      }
    };

    window.addEventListener('keydown', handleKeyDown);
    return () => window.removeEventListener('keydown', handleKeyDown);
  }, []);

  return (
    <div className="presentation-container">
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Source+Sans+3:wght@400;500;600&display=swap');

        * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }

        .presentation-container {
          font-family: 'Source Sans 3', sans-serif;
          background: linear-gradient(145deg, #1a1612 0%, #2d2620 100%);
          min-height: 100vh;
          color: #f5f0e8;
          overflow: hidden;
        }

        .slide {
          min-height: 100vh;
          padding: 60px;
          display: flex;
          flex-direction: column;
          animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
          from { opacity: 0; transform: translateY(10px); }
          to { opacity: 1; transform: translateY(0); }
        }

        /* Title Slide */
        .title-slide {
          justify-content: center;
          align-items: center;
          text-align: center;
          position: relative;
        }

        .title-content {
          z-index: 2;
        }

        .badge {
          display: inline-block;
          background: linear-gradient(135deg, #c9a55c, #a8834a);
          color: #1a1612;
          padding: 8px 20px;
          border-radius: 4px;
          font-size: 14px;
          font-weight: 600;
          letter-spacing: 2px;
          margin-bottom: 24px;
        }

        .title-slide h1 {
          font-family: 'Fraunces', serif;
          font-size: 64px;
          font-weight: 700;
          margin-bottom: 16px;
          background: linear-gradient(135deg, #f5f0e8, #c9a55c);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          background-clip: text;
        }

        .subtitle {
          font-size: 22px;
          color: #a89f94;
          margin-bottom: 60px;
        }

        .start-hint {
          color: #6b635a;
          font-size: 16px;

          border: 1px solid rgba(201, 165, 92, 0.3);
          border-radius: 8px;

          background: rgba(201, 165, 92, 0.1);
          border-color: rgba(201, 165, 92, 0.5);

        .decorative-shapes {
          position: absolute;
          inset: 0;
          overflow: hidden;
          z-index: 1;

        .shape {
          position: absolute;
          border-radius: 50%;
          opacity: 0.1;
        }

        .shape-1 {
          width: 400px;
          height: 400px;
          background: #c9a55c;
          top: -100px;
          right: -100px;

        .shape-2 {
          width: 300px;
          height: 300px;
          background: #7a9e7a;
          bottom: -50px;
          left: -50px;
        }

        /* Section Labels */
        .section-label {
          font-size: 12px;
          font-weight: 600;
          letter-spacing: 2px;
          color: #c9a55c;
          margin-bottom: 12px;
        }

        .system-label {
          color: #7a9e7a;
        }

        /* Headings */
        h2 {

          font-size: 42px;
          font-weight: 600;
          margin-bottom: 40px;
          color: #f5f0e8;
        }

        /* Project Visual */
        .project-visual {
          flex: 1;
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
        }

        .timeline {
          display: flex;
          align-items: center;
          gap: 20px;
          margin-bottom: 30px;
        }

        .timeline-start, .timeline-end {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 8px;
        }

        .dot {
          width: 24px;
          height: 24px;
          border-radius: 50%;
        }

        .start-dot {
          background: #c9a55c;
        }

        .end-dot {
          background: #7a9e7a;
        }

        .timeline-line {
          width: 300px;
          height: 4px;
          background: linear-gradient(90deg, #c9a55c, #7a9e7a);
          border-radius: 2px;
          position: relative;
        }

        .arrow {
          position: absolute;
          right: -8px;
          top: -6px;
          border: solid #7a9e7a;
          border-width: 0 3px 3px 0;
          padding: 6px;
          transform: rotate(-45deg);
        }

        .example-text {
          font-size: 20px;
          color: #a89f94;
          font-style: italic;
        }

        /* Key Insight */
        .key-insight {
          background: rgba(201, 165, 92, 0.1);
          border: 1px solid rgba(201, 165, 92, 0.3);
          border-radius: 12px;
          padding: 24px 32px;
          display: flex;
          align-items: center;
          gap: 16px;
          margin-top: auto;
        }

        .system-insight {
          background: rgba(122, 158, 122, 0.1);
          border-color: rgba(122, 158, 122, 0.3);
        }

        .insight-icon {
          font-size: 28px;
        }

        .key-insight p {
          font-size: 20px;
          color: #f5f0e8;
        }

        /* Progress Examples */
        .progress-examples {
          flex: 1;
          display: flex;
          flex-direction: column;
          justify-content: center;
          gap: 24px;
          max-width: 600px;
        }

        .progress-row {
          display: flex;
          align-items: center;
          gap: 20px;
        }

        .progress-bar {
          width: 300px;
          height: 20px;
          background: rgba(245, 240, 232, 0.1);
          border-radius: 10px;
          overflow: hidden;
        }

        .progress-bar.small {
          width: 120px;
          height: 12px;
        }

        .progress-fill {
          height: 100%;
          background: linear-gradient(90deg, #c9a55c, #dbb86a);
          border-radius: 10px;
          transition: width 0.5s ease;
        }

        .progress-row.complete .progress-fill {
          background: linear-gradient(90deg, #7a9e7a, #8fb88f);
        }

        .progress-label {
          font-size: 18px;
          color: #a89f94;
        }

        /* Project Board */
        .project-board {
          background: rgba(255, 255, 255, 0.03);
          border: 1px solid rgba(255, 255, 255, 0.1);
          border-radius: 16px;
          padding: 24px;
          max-width: 700px;
        }

        .board-header {
          display: flex;
          align-items: center;
          gap: 16px;
          margin-bottom: 24px;
          padding-bottom: 16px;
          border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .board-title {
          font-family: 'Fraunces', serif;
          font-size: 20px;
          font-weight: 600;
        }

        .board-purpose {
          font-size: 12px;
          padding: 4px 12px;
          border-radius: 4px;
          font-weight: 600;
        }

        .board-purpose.bronze {
          background: rgba(205, 127, 50, 0.2);
          color: #cd7f32;
        }

        .mini-progress {
          flex: 1;
          height: 8px;
          background: rgba(255, 255, 255, 0.1);
          border-radius: 4px;
          overflow: hidden;
        }

        .mini-progress-fill {
          height: 100%;
          background: #c9a55c;
          border-radius: 4px;
        }

        .percent {
          font-size: 14px;
          color: #a89f94;
        }

        .kanban {
          display: grid;
          grid-template-columns: repeat(3, 1fr);
          gap: 16px;
        }

        .kanban-column {
          background: rgba(0, 0, 0, 0.2);
          border-radius: 8px;
          padding: 12px;
        }

        .column-header {
          font-size: 11px;
          font-weight: 600;
          letter-spacing: 1px;
          color: #6b635a;
          margin-bottom: 12px;
        }

        .task-card {
          background: rgba(255, 255, 255, 0.05);
          border: 1px solid rgba(255, 255, 255, 0.1);
          border-radius: 6px;
          padding: 10px 12px;
          font-size: 14px;
          margin-bottom: 8px;
        }

        .task-card.active {
          border-color: #c9a55c;
          background: rgba(201, 165, 92, 0.1);
        }

        .task-card.done {
          opacity: 0.5;
          text-decoration: line-through;
        }

        .flow-arrow {
          text-align: center;
          margin-top: 16px;
          font-size: 14px;
          color: #6b635a;
        }

        /* Transition Slide */
        .transition-slide {
          justify-content: center;
          align-items: center;
          text-align: center;
        }

        .transition-content h2 {
          font-size: 36px;
          margin-bottom: 40px;
        }

        .examples-grid {
          display: grid;
          grid-template-columns: repeat(2, 1fr);
          gap: 16px;
          margin-bottom: 40px;
        }

        .example-item {
          background: rgba(255, 255, 255, 0.05);
          border-radius: 8px;
          padding: 16px 24px;
          font-size: 18px;
        }

        .transition-question {
          font-size: 22px;
          color: #7a9e7a;
          font-style: italic;
        }

        /* System Visual */
        .system-visual {
          flex: 1;
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
        }

        .cycle-diagram {
          position: relative;
          width: 280px;
          height: 280px;
          margin-bottom: 20px;
        }

        .cycle-center {
          position: absolute;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 8px;
        }

        .system-icon {
          font-size: 48px;
        }

        .cycle-center span {
          font-weight: 600;
          font-size: 14px;
          letter-spacing: 1px;
        }

        .cycle-ring {
          position: absolute;
          inset: 0;
          border: 3px dashed rgba(122, 158, 122, 0.4);
          border-radius: 50%;
          animation: rotate 20s linear infinite;
        }

        @keyframes rotate {
          from { transform: rotate(0deg); }
          to { transform: rotate(360deg); }
        }

        .cycle-node {
          position: absolute;
          background: #7a9e7a;
          color: #1a1612;
          padding: 6px 12px;
          border-radius: 4px;
          font-size: 12px;
          font-weight: 600;
        }

        .node-1 {
          bottom: 60px;
          right: -20px;
        }

        .node-2 {
          bottom: -10px;
          left: 50%;
          transform: translateX(-50%);
        }

        .cycle-label {
          font-size: 18px;
          color: #7a9e7a;
        }

        /* Comparison Boxes */
        .comparison-boxes {
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 40px;
          flex: 1;
        }

        .comparison-box {
          background: rgba(255, 255, 255, 0.03);
          border: 1px solid rgba(255, 255, 255, 0.1);
          border-radius: 16px;
          padding: 32px;
          width: 280px;
          text-align: center;
        }

        .project-box {
          border-color: rgba(201, 165, 92, 0.3);
        }

        .system-box {
          border-color: rgba(122, 158, 122, 0.3);
        }

        .box-label {
          font-size: 14px;
          color: #6b635a;
          margin-bottom: 8px;

        .box-question {

          justify-content: center;

        .vs-divider {
          font-size: 24px;
          color: #6b635a;
        }

        .health-dots {
          display: flex;
          gap: 4px;
        }

        .health-dots .dot {
          width: 16px;
          height: 16px;
          background: rgba(255, 255, 255, 0.1);
          border-radius: 50%;
        }

        .health-dots .dot.filled {
          background: #7a9e7a;
        }

        /* Difference Table */
        .difference-table {
          max-width: 700px;

        .table-row {
          display: grid;
          grid-template-columns: 120px 1fr 1fr;
          gap: 16px;
          padding: 16px 0;
          border-bottom: 1px solid rgba(255, 255, 255, 0.1);

          border-bottom: 2px solid rgba(255, 255, 255, 0.2);
        }

        .cell {
          font-size: 16px;
        }

        .cell.label {
          color: #6b635a;
          font-weight: 600;
        }

        .project-header {
          color: #c9a55c;
          font-weight: 600;
        }

        .system-header {
          color: #7a9e7a;
          font-weight: 600;
        }

        .shape-arrow {
          color: #c9a55c;
          font-family: monospace;
        }

        .shape-loop {
          font-size: 24px;
        }

        /* System Anatomy */

          flex-direction: column;
          gap: 20px;
          align-items: center;
          flex: 1;
          justify-content: center;

          gap: 20px;
          justify-content: center;
        }

        .component {

          border-radius: 12px;

        .purpose-component {
          background: rgba(122, 158, 122, 0.2);
          min-width: 300px;

        .component-label {
          font-size: 12px;
          font-weight: 600;
          letter-spacing: 1px;
          color: #7a9e7a;
          margin-bottom: 4px;
        }

        .component-desc {
          font-size: 14px;
          color: #a89f94;
        }

        /* Example Breakdown */
        .example-breakdown {
          display: flex;
          flex-direction: column;
          gap: 20px;
          max-width: 600px;
        }

        .example-row {
          display: flex;
          gap: 20px;
          align-items: flex-start;
        }

        .example-label {
          width: 100px;
          font-size: 12px;
          font-weight: 600;
          letter-spacing: 1px;
          color: #7a9e7a;
          padding-top: 4px;
        }

        .example-value {
          flex: 1;
          font-size: 16px;
        }

        .pattern-items {

          flex-direction: column;
          gap: 6px;
        }

        .pattern-items span {
          background: rgba(122, 158, 122, 0.1);

        .life-map-preview {
          display: flex;

          gap: 24px;
        }

        .map-section {
          display: grid;
          grid-template-columns: repeat(2, 1fr);
          gap: 20px;
        }

        .category-card {
          background: rgba(255, 255, 255, 0.03);

          border-radius: 12px;
          overflow: hidden;
        }

        .category-header {
          padding: 12px 16px;
          font-size: 12px;
          font-weight: 600;
          letter-spacing: 1px;
        }

        .health-category {
          background: rgba(122, 158, 122, 0.2);
          color: #7a9e7a;
        }

        .finance-category {
          background: rgba(201, 165, 92, 0.2);
          color: #c9a55c;

        .card-items {
          padding: 16px;
          display: flex;
          flex-direction: column;
          gap: 12px;

        .map-item {

          gap: 12px;
          padding: 12px;
          background: rgba(0, 0, 0, 0.2);

        .item-icon {
          font-size: 18px;
        }

        .item-name {

          font-size: 14px;
        }

        .tiny-progress {

        }

        .tiny-fill {

        }

        .health-indicator {

        }

          color: #8fb88f;

        .legend {

        /* System Board */
        .system-board {
          background: rgba(255, 255, 255, 0.03);
          border: 1px solid rgba(122, 158, 122, 0.3);
          border-radius: 16px;
          overflow: hidden;
          max-width: 500px;

        .system-board-header {
          background: rgba(122, 158, 122, 0.1);

          display: flex;
          justify-content: space-between;

        .header-left {
          display: flex;

          gap: 12px;
        }

        .board-icon {
          font-size: 24px;
        }

        .header-right {
          display: flex;
          align-items: center;
          gap: 8px;
        }

        .health-label {
          font-size: 14px;
          color: #7a9e7a;
        }

        .board-content {
          padding: 24px;
          display: flex;
          flex-direction: column;
          gap: 20px;
        }

        .board-section {
        }

        .section-title {
          font-size: 11px;
          font-weight: 600;
          letter-spacing: 1px;
          color: #6b635a;
          margin-bottom: 8px;
        }

        .pattern-list {

          flex-direction: column;
          gap: 4px;
        }

        .pattern-item {

          color: #a89f94;
        }

        }

        .history-row {
          display: flex;

        }

        }

        .progress-dot {

          width: 24px;
          border-radius: 4px;
        }

          background: #7a9e7a;
        }
      `}</style>

      {slides[currentSlide]()}

      <div className="nav-container">
        <button
          className="nav-btn"
          onClick={prevSlide}
          disabled={currentSlide === 0}
        >
          ←
        </button>
        <div className="progress-dots">
          {slides.map((_, i) => (
            <div
              key={i}
              className={`progress-dot ${i === currentSlide ? (i >= 5 && i <= 9 ? 'active system-active' : 'active') : ''}`}
              onClick={() => setCurrentSlide(i)}
              style={{ cursor: 'pointer' }}
            />
          ))}
        </div>
        <button
          className="nav-btn"
          onClick={nextSlide}
          disabled={currentSlide === slides.length - 1}
        >
          →
        </button>
      </div>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<Presentation />);
    </script>
</body>
</html>

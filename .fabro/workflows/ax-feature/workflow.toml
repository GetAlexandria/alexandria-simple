_version = 1

[workflow]
graph = "workflow.fabro"

[run]
goal = "Implement an Alexandria feature."

[run.inputs]
agent_backend = "api"

[run.model]
provider = "openai"
name = "gpt-5.5"

[run.model.controls]
reasoning_effort = "medium"

[[run.prepare.steps]]
command = ["./scripts/fabro-setup-env"]

[run.git.author]
name = "Fabro"
email = "285810526+fabro-of-alexandria[bot]@users.noreply.github.com"

[run.integrations.github.permissions]
contents = "write"
pull_requests = "write"

[run.pull_request]
enabled = true
draft = false

[run.checkpoint]
exclude_globs = [
  "verification-artifacts/**",
  "screenshots/**",
  "test-results/**",
  "playwright-report/**",
  "*.trace.zip",
]

[run.artifacts]
include = [
  "verification-artifacts/**",
  "screenshots/**",
  "test-results/**",
  "playwright-report/**",
  "*.trace.zip",
]

[run.environment]
id = "daytona"

[environments]

[environments.daytona]
provider = "daytona"

[environments.daytona.lifecycle]
preserve = false
auto_stop = "60m"

[environments.daytona.labels]
project = "alexandria"
workflow = "ax-feature"
host = "railway"

# SUPERSEDED 2026-06-12 (operator ruling): plays run on the EMBEDDED
# factory via `ax2 run frame-the-problem --input key=value`, not on the
# builder Docker/Codex factory this config targeted. Kept verbatim below
# as the harness runs 1-2 actually used (their records cite it).
# Dry-run harness config for the LOCAL Docker/ACP factory
# (.fabro/README.local.md). This wraps the play's workflow.fabro with
# localhost environment specifics; the deployable package's own config
# is ../workflow.toml. Override the fixture per case with -I, e.g.:
#   fabro run --server http://127.0.0.1:3000 studio/plays/frame-the-problem/dry-runs/local-factory.toml \
#     -I transcript=studio/plays/frame-the-problem/fixtures/meeting-snippet-02.md \
#     -I surface_map= -I users=
_version = 1

[workflow]
graph = "../workflow.fabro"

[run]
goal = "Frame the problem behind a pitched solution: one analysis rendered twice — the problem brief (runtime/problem-brief.md) and the spoken paragraph — built from the conversation transcript, every claim verbatim-traceable."

[run.inputs]
agent_backend = "acp"
acp_command = "codex-acp"
transcript = "studio/plays/frame-the-problem/fixtures/meeting-snippet-01.md"
surface_map = "studio/plays/frame-the-problem/fixtures/saddle/surface-map.md"
users = "studio/plays/frame-the-problem/fixtures/saddle/users.md"
prior_brief = ""

[run.pull_request]
enabled = false

[run.checkpoint]
exclude_globs = []

[run.artifacts]
include = ["runtime/**"]

[run.environment]
id = "default"

[environments]

[environments.default]
provider = "docker"

[environments.default.image]
docker = "alexandria/fabro-codex-acp:local-auth"

[environments.default.resources]
memory = "6GB"
cpu = 4
